databases:
  - name: notify-db
    plan: starter
    databaseName: notification_api
    postgresMajorVersion: "15"
    region: oregon

envVarGroups:
  # Shared config inherited by all services.
  # Secrets (API_HOST_NAME, AWS creds, etc.) must be set manually
  # in the Render dashboard after first deploy — they cannot be
  # defined in the blueprint.
  - name: notify-shared
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: RENDER
        value: "true"
      - key: FLASK_APP
        value: application.py
      - key: NOTIFY_APP_NAME
        value: api
      - key: NOTIFY_ENVIRONMENT
        value: production
      - key: REDIS_ENABLED
        value: "1"
      - key: ANTIVIRUS_ENABLED
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DANGEROUS_SALT
        generateValue: true
      - key: ADMIN_CLIENT_SECRET
        generateValue: true
      - key: SES_AWS_REGION
        value: us-west-2
      - key: SNS_AWS_REGION
        value: us-west-2
      - key: CSV_AWS_REGION
        value: us-west-2

services:
  - type: redis
    name: notify-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    region: oregon
    ipAllowList: [] # allow only internal Render services

  - type: web
    name: notify-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install poetry && poetry install --only main && poetry run flask db upgrade
    startCommand: poetry run gunicorn -c gunicorn_config.py gunicorn_entry:application
    healthCheckPath: /_status?simple=true
    envVars:
      - fromGroup: notify-shared
      - key: FLASK_DEBUG
        value: "false"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: notify-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: notify-redis
          type: redis
          property: connectionString
      - key: NOTIFY_E2E_TEST_EMAIL
        value: e2e-test@example.gov
      - key: NOTIFY_E2E_TEST_PASSWORD
        generateValue: true

  - type: worker
    name: notify-worker
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install poetry && poetry install --only main
    startCommand: poetry run celery -A run_celery.notify_celery worker --loglevel=INFO --pool=gevent --concurrency=10 --prefetch-multiplier=2
    envVars:
      - fromGroup: notify-shared
      - key: DATABASE_URL
        fromDatabase:
          name: notify-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: notify-redis
          type: redis
          property: connectionString

  - type: worker
    name: notify-beat
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install poetry && poetry install --only main
    startCommand: poetry run celery -A run_celery.notify_celery beat --loglevel=INFO
    envVars:
      - fromGroup: notify-shared
      - key: DATABASE_URL
        fromDatabase:
          name: notify-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: notify-redis
          type: redis
          property: connectionString
